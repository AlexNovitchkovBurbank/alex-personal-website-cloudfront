service: alex-personal-website-cloudfront

custom:
  stage: ${opt:stage, 'np'}
provider:
  name: aws
  region: us-west-2
  environment:
    DOMAIN_URL: ${file(env.yml):${self:custom.stage}.DOMAIN_URL}
    ROUTE53_PUBLIC_HOSTED_ZONE_ID: ${file(env.yml):${self:custom.stage}.ROUTE53_PUBLIC_HOSTED_ZONE_ID}
    DOMAIN_CERTIFICATE_ARN: ${file(env.yml):${self:custom.stage}.DOMAIN_CERTIFICATE_ARN}
    CODE_BUCKET_NAME: ${cf:alex-personal-website-code-bucket-${self:custom.stage}.S3PageBucket}
    PROJECT_DATA_BUCKET_NAME: ${cf:alex-personal-website-project-data-bucket-${self:custom.stage}.S3PageBucket}
  deploymentBucket:
    name: alex-personal-website-stack-bucket-np
  stackTags:
    application: "PersonalWebsite"
    owner: "Alex"

resources:
  Resources:
    CloudFrontOAC:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: !Sub "${AWS::StackName}-oac"
          Description: "OAC for CloudFront to access S3 bucket"
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4
    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Aliases:
            - ${self:provider.environment.DOMAIN_URL}
          ViewerCertificate:
            AcmCertificateArn: ${self:provider.environment.DOMAIN_CERTIFICATE_ARN}
            SslSupportMethod: "sni-only"
          Enabled: true
          DefaultRootObject: index.html
          Origins:
            - DomainName:
                Fn::Join:
                  - ''
                  - - ${self:provider.environment.CODE_BUCKET_NAME}
                    - '.s3.amazonaws.com'
              Id: ${self:provider.environment.CODE_BUCKET_NAME}
              S3OriginConfig: {} # required but empty for OAC
              OriginAccessControlId: !Ref CloudFrontOAC
            - DomainName:
                Fn::Join:
                  - ''
                  - - ${self:provider.environment.PROJECT_DATA_BUCKET_NAME}
                    - '.s3.amazonaws.com'
              Id: ${self:provider.environment.PROJECT_DATA_BUCKET_NAME}
              S3OriginConfig: {} # required but empty for OAC
              OriginAccessControlId: !Ref CloudFrontOAC
          DefaultCacheBehavior:
            TargetOriginId: ${self:provider.environment.CODE_BUCKET_NAME}
            ForwardedValues:
              Cookies:
                Forward: "none"
              QueryString: "true"
              Headers:
                - Access-Control-Request-Headers
                - Access-Control-Request-Method
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - GET
              - PUT
              - DELETE
              - PATCH
              - POST
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
          CacheBehaviors:
            - PathPattern: "designs/*"
              TargetOriginId: ${self:provider.environment.PROJECT_DATA_BUCKET_NAME}
              ForwardedValues:
                Cookies:
                  Forward: "none"
                QueryString: "false"
              ViewerProtocolPolicy: https-only
              AllowedMethods:
                - GET
                - HEAD
              CachedMethods:
                - GET
                - HEAD
            - PathPattern: "text/*"
              TargetOriginId: ${self:provider.environment.PROJECT_DATA_BUCKET_NAME}
              ForwardedValues:
                Cookies:
                  Forward: "none"
                QueryString: "false"
              ViewerProtocolPolicy: https-only
              AllowedMethods:
                - GET
                - HEAD
              CachedMethods:
                - GET
                - HEAD
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 0
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 0
        Tags:
          - Key: Environment
            Value: dev
          - Key: owner
            Value: Alex
          - Key: application
            Value: PersonalWebsite
    ResponseHeadersPolicy:
      Type: AWS::CloudFront::ResponseHeadersPolicy
      Properties: 
        ResponseHeadersPolicyConfig: 
          Name: personal-website-cloudfront-response-headers-policy-config-${self:custom.stage}
          CorsConfig: 
            AccessControlAllowCredentials: true
            AccessControlAllowHeaders: 
              Items: 
                - "Content-Type"
            AccessControlAllowMethods: 
              Items: 
                - GET
                - PUT
                - POST
                - DELETE
                - HEAD
                - OPTIONS
            AccessControlAllowOrigins:
              Items:
                - Fn::Join:
                  - ''
                  - - 'https://'
                    - !GetAtt CloudFrontDistribution.DomainName
            OriginOverride: false
    CodeBucketPolicy:
      Type: AWS::S3::BucketPolicy
      DependsOn: CloudFrontDistribution
      Properties:
        Bucket: ${self:provider.environment.CODE_BUCKET_NAME}
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            # Allow CloudFront OAC to read objects
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::${self:provider.environment.CODE_BUCKET_NAME}/*"
              Condition:
                StringEquals:
                  aws:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}" # reference a resource so not the id
            # Protect bucket policy from modification
            - Sid: DenyPolicyChanges
              Effect: Deny
              Action:
                - s3:DeleteBucketPolicy
                - s3:PutBucketPolicy
              Resource: !Sub "arn:aws:s3:::${self:provider.environment.CODE_BUCKET_NAME}"
              Principal: "*"
              Condition:
                ArnNotEquals:
                  aws:PrincipalARN:
                    - !Sub "arn:aws:iam::${AWS::AccountId}:user/Alex"
            # Deny object writes except for your IAM user
            - Sid: DenyObjectWrites
              Effect: Deny
              Action:
                - s3:PutObject*
                - s3:DeleteObject*
              Resource: !Sub "arn:aws:s3:::${self:provider.environment.CODE_BUCKET_NAME}/*"
              Principal: "*"
              Condition:
                ArnNotEquals:
                  aws:PrincipalARN:
                    - !Sub "arn:aws:iam::${AWS::AccountId}:user/Alex"
    ProjectDataBucketPolicy:
      Type: AWS::S3::BucketPolicy
      DependsOn: CloudFrontDistribution
      Properties:
        Bucket: ${self:provider.environment.PROJECT_DATA_BUCKET_NAME}
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            # Allow CloudFront OAC to read objects
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::${self:provider.environment.PROJECT_DATA_BUCKET_NAME}/*"
              Condition:
                StringEquals:
                  aws:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
            # Protect bucket policy from modification
            - Sid: DenyPolicyChanges
              Effect: Deny
              Action:
                - s3:DeleteBucketPolicy
                - s3:PutBucketPolicy
              Resource: !Sub "arn:aws:s3:::${self:provider.environment.PROJECT_DATA_BUCKET_NAME}"
              Principal: "*"
              Condition:
                ArnNotEquals:
                  aws:PrincipalARN:
                    - !Sub "arn:aws:iam::${AWS::AccountId}:user/Alex"
            # Deny object writes except for your IAM user
            - Sid: DenyObjectWrites
              Effect: Deny
              Action:
                - s3:PutObject*
                - s3:DeleteObject*
              Resource: !Sub "arn:aws:s3:::${self:provider.environment.PROJECT_DATA_BUCKET_NAME}/*"
              Principal: "*"
              Condition:
                ArnNotEquals:
                  aws:PrincipalARN:
                    - !Sub "arn:aws:iam::${AWS::AccountId}:user/Alex"
    CloudfrontRoute53RecordSet:
      Type: "AWS::Route53::RecordSet"
      Properties:
        Name: ${self:provider.environment.DOMAIN_URL}
        HostedZoneId: ${self:provider.environment.ROUTE53_PUBLIC_HOSTED_ZONE_ID}
        Type: "A"
        AliasTarget:
          HostedZoneId: "Z2FDTNDATAQYW2"
          DNSName: !GetAtt [CloudFrontDistribution, DomainName]

  Outputs:
    CloudFrontDistributionDomainName:
      Value: !GetAtt CloudFrontDistribution.DomainName
      Export:
        Name: personal-website-cloudfront-distribution-domain-name
    CloudFrontDistributionId:
      Value: !GetAtt CloudFrontDistribution.Id
      Export:
        Name: personal-website-cloudfront-distribution-id
